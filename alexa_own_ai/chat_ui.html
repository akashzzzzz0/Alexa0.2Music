<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18"><title>Alexa — Own AI Chat</title>
<style>
:root{color-scheme:dark;--bg:#080c16;--panel:#101827;--line:#25354b;--muted:#91a3ba;--text:#edf4ff;--cyan:#6ee7f9;--violet:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1c3150 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;justify-content:center}
.shell{width:min(920px,100%);height:100dvh;display:flex;flex-direction:column;padding:18px 18px 14px}
header{display:flex;align-items:center;gap:12px;padding:8px 4px 18px;border-bottom:1px solid #203047}
.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#164e63,#5b21b6);display:grid;place-items:center;font-size:22px;box-shadow:0 0 28px #22d3ee30}
h1{font-size:17px;margin:0;letter-spacing:.2px} .sub{font-size:12px;color:var(--muted)}.spacer{flex:1}
.status{font-size:11px;color:#9fe8c1;border:1px solid #28664d;border-radius:99px;padding:5px 9px}
#feed{flex:1;overflow:auto;padding:24px 4px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.welcome{margin:auto;text-align:center;max-width:470px;color:var(--muted)}.welcome .orb{font-size:42px;margin-bottom:10px}.welcome h2{color:var(--text);font-size:24px;margin:0 0 8px}
.msg{max-width:min(78%,680px);padding:12px 15px;border:1px solid var(--line);border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:linear-gradient(135deg,#183b58,#30245a);border-color:#365477;border-bottom-right-radius:5px}
.assistant{align-self:flex-start;background:#111c2b;border-bottom-left-radius:5px}
.meta{font-size:10px;color:var(--muted);margin:0 3px 5px}.row{display:flex;gap:9px;align-items:center}
.composer{border:1px solid #2b3c54;background:#101827;border-radius:20px;padding:10px;box-shadow:0 12px 45px #0005}
textarea{flex:1;resize:none;min-height:46px;max-height:150px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:10px}
button{border:0;border-radius:13px;padding:11px 16px;background:linear-gradient(135deg,#0e7490,#6d28d9);color:white;font-weight:650;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}.foot{display:flex;align-items:center;gap:10px;padding:10px 5px 0;color:var(--muted);font-size:11px}
.settings{display:flex;gap:8px;align-items:center}input{width:170px;max-width:36vw;background:#0c1421;border:1px solid var(--line);border-radius:10px;padding:7px 9px;color:var(--text);font-size:11px}
.typing{color:var(--muted);font-size:12px;padding:2px 8px}
@media(max-width:560px){.shell{padding:10px 10px 9px}.msg{max-width:90%}.status{display:none}.foot{flex-wrap:wrap}.settings{width:100%}input{flex:1;max-width:none}}
</style></head>
<body><main class="shell">
<header><div class="avatar">✦</div><div><h1>Alexa <span style="color:var(--cyan)">Own AI</span></h1><div class="sub">A natural conversation, in your language</div></div><div class="spacer"></div><div class="status">● PRIVATE CHAT SESSION</div></header>
<section id="feed" aria-live="polite"><div class="welcome" id="welcome"><div class="orb">✧</div><h2>What’s on your mind?</h2><div>Talk naturally. Alexa can follow the conversation in English, Roman Urdu, Hindi and more.</div></div></section>
<div class="composer"><div class="row"><textarea id="message" rows="1" placeholder="Message Alexa…" aria-label="Message Alexa"></textarea><button id="send">Send ↑</button></div></div>
<div class="foot"><span id="hint">Enter to send · Shift + Enter for a new line</span><span class="spacer"></span><div class="settings"><label for="token">Access token</label><input id="token" type="password" autocomplete="off" placeholder="Service token (if enabled)"></div></div>
</main>
<script>
const feed=document.getElementById('feed'),box=document.getElementById('message'),send=document.getElementById('send'),token=document.getElementById('token'),hint=document.getElementById('hint');
const conversationId='web:'+((crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36));
function add(text,role){document.getElementById('welcome')?.remove();const wrap=document.createElement('div');wrap.className='msg '+role;wrap.textContent=text;feed.appendChild(wrap);feed.scrollTop=feed.scrollHeight;return wrap}
async function submit(){const message=box.value.trim();if(!message||send.disabled)return;add(message,'user');box.value='';box.style.height='auto';send.disabled=true;hint.textContent='Alexa is thinking…';const pending=add('…','assistant');
try{const headers={'Content-Type':'application/json'};if(token.value.trim())headers.Authorization='Bearer '+token.value.trim();
const response=await fetch('/chat',{method:'POST',headers,body:JSON.stringify({conversation_id:conversationId,message})});
const data=await response.json();if(!response.ok)throw new Error(data.error||'Request failed ('+response.status+')');
pending.textContent=data.reply||' ';if(!data.reply)pending.remove();if(data.is_llm===false)hint.textContent='Local conversation mode';else hint.textContent='Connected · '+(data.provider||'Alexa Own AI');
}catch(err){pending.textContent='Could not connect: '+err.message;hint.textContent='Check the service and access token, then try again.'}
finally{send.disabled=false;box.focus()}}
send.addEventListener('click',submit);box.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});box.addEventListener('input',()=>{box.style.height='auto';box.style.height=Math.min(box.scrollHeight,150)+'px'});
</script></body></html>
