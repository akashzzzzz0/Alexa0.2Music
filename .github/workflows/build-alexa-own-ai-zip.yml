name: Build Alexa Own AI ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "alexa_own_ai/**"
      - ".github/workflows/build-alexa-own-ai-zip.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create ZIP
        run: |
          cd alexa_own_ai
          zip -r ../alexa-own-ai.zip . -x "*.pyc" "__pycache__/*" ".env" ".venv/*"
      - name: Publish ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: alexa-own-ai
          path: alexa-own-ai.zip
          if-no-files-found: error
          retention-days: 90
