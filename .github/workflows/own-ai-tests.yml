name: Alexa Own AI checks
on:
  push:
    paths:
      - "own_ai/**"
      - ".github/workflows/own-ai-tests.yml"
  pull_request:
    paths:
      - "own_ai/**"
      - ".github/workflows/own-ai-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r own_ai/requirements.txt
      - run: python -m unittest discover -s own_ai/tests -v
