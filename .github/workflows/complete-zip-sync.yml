name: Complete uploaded ZIP sync
on:
  push:
    branches:
      - full-zip-exchange-2026-11-13
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-zip-exchange-2026-11-13
      - name: Replace branch with the exact source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fL "https://github.com/antlis/tg-streaming-bot/archive/a2ef52ec6247411ddbb44bc117dec67ff21f4b96.zip" -o /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          rsync -a --delete --exclude='.git' /tmp/source/tg-streaming-bot-a2ef52ec6247411ddbb44bc117dec67ff21f4b96/ ./
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Complete exact tg-streaming-bot ZIP replacement"
            git push origin HEAD:full-zip-exchange-2026-11-13
          fi
